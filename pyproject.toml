# this_file: pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-mkdocs-text-export"
dynamic = ["version"]
description = "An MkDocs plugin to export content pages as plain-text or Markdown files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Adam Twardoch", email = "adam+github@twardoch.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
keywords = ["mkdocs", "txt", "plaintext", "markdown", "export"]
dependencies = [
    "mkdocs>=1.5.0",
    # html22text is vendored in mkdocs_text_export_plugin/_vendor/ (not on PyPI);
    # these are its runtime dependencies.
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
    "mkdocs-material",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-mkdocs-text-export"
Documentation = "https://vexy.dev/vexy-mkdocs-text-export/"
Repository = "https://github.com/vexyart/vexy-mkdocs-text-export"
Issues = "https://github.com/vexyart/vexy-mkdocs-text-export/issues"
Changelog = "https://github.com/vexyart/vexy-mkdocs-text-export/blob/main/CHANGELOG.md"

[project.entry-points."mkdocs.plugins"]
text-export = "mkdocs_text_export_plugin.plugin:MdTxtExportPlugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mkdocs_text_export_plugin/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_text_export_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "/mkdocs_text_export_plugin",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mkdocs_text_export_plugin/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# MkDocs and html2text ship without type stubs.
[[tool.mypy.overrides]]
module = ["mkdocs.*", "html2text.*"]
ignore_missing_imports = true

# Vendored third-party code is checked upstream, not here.
[[tool.mypy.overrides]]
module = ["mkdocs_text_export_plugin._vendor.*"]
ignore_errors = true
