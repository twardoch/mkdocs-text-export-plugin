# this_file: pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-mkdocs-text-export"
dynamic = ["version"]
description = "An MkDocs plugin to export content pages as plain-text or Markdown files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Adam Twardoch", email = "adam+github@twardoch.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
keywords = ["mkdocs", "txt", "plaintext", "markdown", "export"]
dependencies = [
    "mkdocs>=1.5.0",
    "html2text",
    "beautifulsoup4>=4.0.0",
    "html22text @ git+https://github.com/twardoch/html22text",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mkdocs-material",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-mkdocs-text-export"
Repository = "https://github.com/vexyart/vexy-mkdocs-text-export"
Issues = "https://github.com/vexyart/vexy-mkdocs-text-export/issues"
Changelog = "https://github.com/vexyart/vexy-mkdocs-text-export/blob/main/CHANGELOG.md"

[project.entry-points."mkdocs.plugins"]
text-export = "mkdocs_text_export_plugin.plugin:MdTxtExportPlugin"

[tool.hatch.metadata]
# html22text is currently only available from GitHub, not PyPI.
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mkdocs_text_export_plugin/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_text_export_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "/mkdocs_text_export_plugin",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
