# this_file: docs/_config.yml
title: vexy-mkdocs-text-export
description: Your MkDocs site, as plain text. Grep-friendly.
remote_theme: just-the-docs/just-the-docs

url: https://vexyart.github.io
baseurl: /vexy-mkdocs-text-export

# Just the Docs options
search_enabled: true
heading_anchors: true
color_scheme: light
enable_copy_code_button: true

aux_links:
  GitHub: https://github.com/vexyart/vexy-mkdocs-text-export
aux_links_new_tab: true

callouts:
  note:
    color: blue
  warning:
    color: yellow
  tip:
    color: green

plugins:
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
